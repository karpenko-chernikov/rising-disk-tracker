# Параметры железки (один раз измерить)
радиус_ведущего_колеса_мм: 15   # r_кол — для пересчёта n (об/мин) → W
установка: бобры1               # имя стенда; при смене дисков не менять

# Знак δ в имени файла (n120_d-10) — ГОРИЗОНТАЛЬНЫЙ сдвиг:
#   d+12 или d12  = контакт ПРАВЕЕ центра диска на 12 мм (как на видео)
#   d-10          = контакт ЛЕВЕЕ центра на 10 мм
#   d0            = контакт напротив центра по горизонтали
# Вертикаль в d не пишем. В статье Maas O = точка контакта; наш d — смещение центра диска от O по Y.
