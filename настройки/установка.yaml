# Параметры железки (один раз измерить)
радиус_ведущего_колеса_мм: 15   # r_кол — для пересчёта n (об/мин) → W
установка: бобры1               # имя стенда; при смене дисков не менять

# Знак δ в имени файла (n120_d-10):
#   d+12 или d12  = контакт ролика ВЫШЕ центра диска на 12 мм
#   d-10          = контакт НИЖЕ центра на 10 мм
#   d0            = контакт на высоте центра
# Мерить вертикаль (к потолку / к столу), не вбок.
